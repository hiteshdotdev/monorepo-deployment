name: 'CD Staging'
run-name: 'Continuous Deployment to Staging'
on:
  push:
    branches: ['main']

jobs:
    Continuous-Deployment: 
        runs-on: ubuntu-latest
        environment: staging
        steps:
          - name: Logging into staging server and building the application
            uses: appleboy/ssh-action@v1.0.3
            with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USER }}
                key: ${{ secrets.SSH_PVT_KEY }}
                port: ${{ secrets.SSH_PORT || 22 }}
                script_stop: true
                script: |
                    cd /home/hit/monorepo-deployment
                    git pull origin main
                    pnpm install
                    pnpm run build
                    pm2 restart web-app
                    /usr/sbin/nginx -s reload
                    pm2 restart http-server
                    pm2 restart ws-server